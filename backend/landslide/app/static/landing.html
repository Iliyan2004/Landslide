<html lang="en">

<title>LANDLAB</title>
<meta name="description" content="LANDLAB - landslide hazard and impact modelling for Pakistan: rain and earthquake triggers, debris runout, buildings, roads and loss.">
<meta name="theme-color" content="#000">

<style>
  :root {
    --ink: #6ff2e6;
    --aqua: #2fd6c9;
    --aqua-deep: #0c8f88;
    --bg: #000;
    --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --text: "Archivo Narrow", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--text);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  /* CSS-only sea shown if WebGL is unavailable */
  body.no-gl {
    background:
      radial-gradient(120% 60% at 50% 0%, #0f3a3a 0%, transparent 60%),
      linear-gradient(180deg, #050a0a 0%, #0a2a2b 38%, #031012 70%, #000 100%);
  }
  canvas#sea { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .veil {
    position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(60% 46% at 50% 50%, rgba(0, 0, 0, .6) 0%, rgba(0, 0, 0, .28) 55%, transparent 100%),
      radial-gradient(130% 100% at 50% 50%, transparent 55%, rgba(0, 4, 6, .6) 100%);
  }
  header.top, footer.meta {
    position: fixed; z-index: 3; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; gap: 16px;
    padding: 0 clamp(16px, 4vw, 48px); font-size: .74rem; letter-spacing: .26em; text-transform: uppercase;
    color: rgba(255, 255, 255, .72);
  }
  header.top { top: 0; height: 58px; border-bottom: 1px solid rgba(111, 242, 230, .2); background: linear-gradient(180deg, rgba(0, 0, 0, .75), rgba(0, 0, 0, .25)); }
  header.top .left { display: flex; align-items: center; gap: 14px; min-width: 0; }
  header.top .brand { font-family: var(--display); font-weight: 800; letter-spacing: .3em; color: #fff; }
  header.top .agn-logo {
    display: inline-flex; align-items: center; line-height: 0; flex: 0 0 auto;
    background: #fff; border-radius: 6px; padding: 3px 8px;
    border: 1px solid rgba(111, 242, 230, .25); text-decoration: none;
  }
  header.top .agn-logo img { height: 28px; width: auto; display: block; }
  footer.meta { bottom: 0; height: 52px; border-top: 1px solid rgba(111, 242, 230, .2); background: linear-gradient(0deg, rgba(0, 0, 0, .75), rgba(0, 0, 0, .25)); padding-bottom: env(safe-area-inset-bottom); }
  @media (max-width: 640px) { header.top .tag { display: none; } footer.meta span:first-child { display: none; } footer.meta { justify-content: center; } }
  main {
    position: relative; z-index: 2;
    min-height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 14vh 20px 14vh;
    text-align: center;
  }
  h1 {
    margin: 0;
    font-family: var(--display);
    font-weight: 800;
    font-stretch: 100%;
    font-size: clamp(2.2rem, 7.2vw, 5.2rem);
    line-height: 1;
    letter-spacing: .16em;
    padding-left: .16em; /* optical centering against trailing letter-spacing */
    color: #fff;
    text-shadow: 0 0 30px rgba(47, 214, 201, .4), 0 0 80px rgba(47, 214, 201, .22), 0 2px 24px rgba(0, 0, 0, .8);
  }
  .full {
    margin: clamp(16px, 3vh, 30px) 0 0;
    max-width: 40em;
    font-family: var(--text);
    font-weight: 500;
    font-size: clamp(.78rem, 1.3vw, .98rem);
    letter-spacing: .28em;
    text-transform: uppercase;
    line-height: 2;
    text-wrap: balance;
    color: #fff;
    text-shadow: 0 2px 14px rgba(0, 0, 0, .9);
  }
  .full b { color: #fff; font-weight: 700; }
  .rule {
    width: 64px; height: 1px; margin: clamp(22px, 4vh, 40px) 0;
    background: var(--aqua);
    opacity: .9;
  }
  .choices { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .open {
    appearance: none; text-decoration: none; cursor: pointer;
    display: inline-flex; align-items: center; gap: .9em;
    padding: 1em 2.2em;
    font-family: var(--display); font-weight: 700; font-stretch: 100%;
    font-size: clamp(.8rem, 1.2vw, .92rem);
    letter-spacing: .24em; text-transform: uppercase;
    color: #fff;
    background: rgba(0, 0, 0, .55);
    border: 1px solid var(--aqua);
    border-radius: 2px;
    transition: background .25s, color .25s, border-color .25s;
  }
  .open svg { width: 1.2em; height: 1.2em; transition: transform .3s cubic-bezier(.2, .8, .2, 1); }
  .open:hover, .open:focus-visible { background: var(--aqua); color: #000; }
  .open:hover svg, .open:focus-visible svg { transform: translateX(4px); }
  .open:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }
  .rise > * { opacity: 0; transform: translateY(18px); animation: rise .9s cubic-bezier(.2, .8, .2, 1) forwards; }
  .rise > :nth-child(1) { animation-delay: .15s; }
  .rise > :nth-child(2) { animation-delay: .4s; }
  .rise > :nth-child(3) { animation-delay: .6s; }
  .rise > :nth-child(4) { animation-delay: .75s; }
  @keyframes rise { to { opacity: 1; transform: none; } }
  .flash {
    position: fixed; inset: 0; z-index: 5; pointer-events: none; opacity: 0;
    background: radial-gradient(circle at 50% 55%, #7ff5ea 0%, #12766f 38%, #000 100%);
  }
  @media (prefers-reduced-motion: reduce) {
    .rise > * { animation: none; opacity: 1; transform: none; }
    .open::before { animation: none; }
  }
  @media (max-width: 520px) { main { padding-left: 14px; padding-right: 14px; } h1 { letter-spacing: .12em; } .full { letter-spacing: .14em; font-size: .72rem; line-height: 1.9; max-width: 100%; overflow-wrap: anywhere; } .open { padding-left: 22px; padding-right: 22px; } }
  @media (max-height: 520px) { h1 { font-size: clamp(2rem, 8vw, 4.5rem); } .rule { margin: 10px 0 16px; } }
</style>
</head>

"float fbm(vec2 p){ float a=.5,s=0.; for(int i=0;i<5;i++){ s+=a*noise(p); p=p*2.03+vec2(7.1,3.7); a*=.5; } return s; }",
"float fbm3(vec2 p){ float a=.5,s=0.; for(int i=0;i<3;i++){ s+=a*noise(p); p=p*2.03+vec2(7.1,3.7); a*=.5; } return s; }",
"float ridgeH(float x, float seed, float base, float amp){ return base + amp*(fbm(vec2(x*1.6+seed, seed*0.37)) - 0.4); }",
"void main(){",
"  vec2 uv = gl_FragCoord.xy / uRes; float asp = uRes.x / uRes.y;",
"  vec2 p = vec2((uv.x - 0.5) * asp, uv.y) + uMouse * vec2(0.025, 0.012);",
"  vec3 col = mix(vec3(0.010, 0.040, 0.046), vec3(0.030, 0.150, 0.160), pow(uv.y, 1.3));",
"  col += 0.10 * vec3(0.35, 0.95, 0.88) * exp(-pow(length(p - vec2(0.62, 0.80)) * 3.2, 2.0));            // moon glow",
"  col += 0.07 * fbm3(vec2(p.x * 1.6 + uTime * 0.03, p.y * 3.0)) * vec3(0.4, 0.9, 0.85) * smoothstep(0.3, 0.9, uv.y);",
"  // distant ridges",
"  float h1 = ridgeH(p.x, 1.0, 0.64, 0.38); float m1 = smoothstep(0.003, -0.003, p.y - h1);",
"  col = mix(col, vec3(0.050, 0.200, 0.205) + 0.05 * fbm(p * 5.0), m1);",
"  float h2 = ridgeH(p.x * 1.15 + 3.0, 2.0, 0.50, 0.34); float m2 = smoothstep(0.003, -0.003, p.y - h2);",
"  col = mix(col, vec3(0.030, 0.135, 0.140) + 0.05 * fbm(p * 8.0 + 2.0), m2);",
"  // the main slope: a steep face falling from the upper left to the valley floor",
"  float floorY = 0.15 + 0.012 * fbm3(vec2(p.x * 6.0, 4.0));",
"  float face = 0.78 - 0.80 * (p.x + 0.55) + 0.05 * (fbm(vec2(p.x * 3.5, 9.0)) - 0.4);              // surface height of the slope",
"  float terr = max(face, floorY);",
"  float inside = terr - p.y;                                                                        // depth below the ground surface",
"  float mt = smoothstep(-0.003, 0.003, inside);",
"  float grain = fbm(vec2(p.x * 16.0, p.y * 16.0));",
"  vec3 rock = mix(vec3(0.030, 0.110, 0.115), vec3(0.115, 0.250, 0.240), grain);",
"  rock *= 0.75 + 0.45 * smoothstep(0.4, 0.8, fbm(vec2(p.x * 20.0 + p.y * 3.0, p.y * 30.0)));         // strata and gullies",
"  float rim = exp(-inside * 90.0) * 0.9;                                                            // moonlit edge",
"  rock += rim * vec3(0.20, 0.55, 0.50);",
"  col = mix(col, rock, mt);",
"  // the debris flow: slides along the surface, front advances with uFront on entering",
"  float adv = clamp((13.0 - uFront) / 19.0, 0.0, 1.0);",
"  float s = 0.18 + 0.10 * (0.5 + 0.5 * sin(uTime * 0.35)) + 0.72 * adv * adv;                       // 0..1 progress of the front down the slope",
"  float xs = -0.60 + 1.45 * s;                                                                      // front position (screen x)",
"  float xsrc = -0.62;",
"  float tt = clamp((p.x - xsrc) / max(xs - xsrc, 0.01), 0.0, 1.0);",
"  float thick = (0.012 + 0.050 * sin(tt * 3.14159) * (0.6 + 0.4 * tt)) * (0.7 + 0.5 * fbm3(vec2(p.x * 9.0 - uTime * 0.5, 1.0)));",
"  float onFace = step(floorY + 0.02, face);",
"  float yTop = terr + 0.004, yBot = terr - thick - 0.012;",
"  float inFlow = smoothstep(yBot - 0.004, yBot + 0.004, p.y) * smoothstep(yTop + 0.004, yTop - 0.002, p.y) * step(xsrc, p.x) * smoothstep(xs + 0.02, xs - 0.04, p.x);",
"  float tex = fbm(vec2(p.x * 11.0 - uTime * 0.9, p.y * 40.0 + uTime * 0.2));",
"  vec3 mud = mix(vec3(0.20, 0.115, 0.050), vec3(0.78, 0.50, 0.22), tex);",
"  float frontGlow = smoothstep(0.10, 0.0, abs(p.x - xs)) * 0.9;",
"  mud += vec3(0.50, 0.34, 0.14) * frontGlow * smoothstep(yBot, yBot + 0.02, p.y);",
"  col = mix(col, mud, clamp(inFlow * 1.25, 0.0, 0.97));",
"  // dust plume at the front",
"  float plume = exp(-pow((p.x - xs - 0.03) * 5.0, 2.0)) * exp(-pow((p.y - terr - 0.04) * 9.0, 2.0)) * (0.5 + 0.5 * fbm3(vec2(p.x * 6.0 - uTime * 0.4, p.y * 6.0)));",
"  col += vec3(0.30, 0.22, 0.12) * plume * 0.55 * step(xsrc, xs);",
"  // deposit on the valley floor once the flow arrives",
"  float reach = smoothstep(0.55, 1.0, s);",
"  float fan = smoothstep(floorY + 0.05 * reach, floorY - 0.003, p.y) * step(-0.05, p.y - (floorY - 0.05)) * smoothstep(0.1, 0.5, p.x - (-0.15)) * reach;",
"  col = mix(col, mix(vec3(0.22, 0.13, 0.06), vec3(0.55, 0.37, 0.17), fbm(p * vec2(14.0, 40.0))), clamp(fan, 0.0, 0.95) * mt);",
"  // houses on the valley floor, windows go dark as the flow reaches them",
"  float hx = floor((p.x + 1.4) * 8.0); float hf = fract((p.x + 1.4) * 8.0);",
"  float hh = 0.030 + 0.050 * hash(vec2(hx, 2.0));",
"  float has = step(0.45, hash(vec2(hx, 7.0))) * step(0.05, p.x - (-0.05));",
"  float house = has * step(0.14, hf) * step(hf, 0.86) * step(p.y, floorY + hh) * step(floorY - 0.003, p.y);",
"  float roof = has * step(0.10, hf) * step(hf, 0.90) * step(p.y, floorY + hh + 0.012 * (1.0 - abs(hf - 0.5) * 2.0)) * step(floorY + hh - 0.002, p.y);",
"  float alive = 1.0 - smoothstep(0.62, 0.95, s);",
"  float win = step(0.55, hash(vec2(hx, 3.0))) * step(0.5, fract(p.y * 50.0)) * step(0.3, fract(hf * 3.0)) * alive;",
"  vec3 hc = vec3(0.020, 0.075, 0.080) + win * vec3(0.95, 0.62, 0.20) * 0.8;",
"  col = mix(col, hc, max(house, roof));",
"  // rain, two layers",
"  for (int k = 0; k < 2; k++) {",
"    float fk = float(k);",
"    vec2 g = vec2(uv.x * (110.0 + 70.0 * fk) * asp + uv.y * 9.0, uv.y * (7.0 + 4.0 * fk) + uTime * (10.0 + 5.0 * fk));",
"    vec2 id = floor(g); vec2 f = fract(g);",
"    float on = step(0.955 - 0.012 * fk, hash(id + fk * 17.0));",
"    float streak = on * smoothstep(0.0, 0.6, f.y) * smoothstep(1.0, 0.6, f.y) * smoothstep(0.18, 0.08, abs(f.x - 0.5));",
"    col += (0.16 - 0.05 * fk) * vec3(0.40, 0.95, 0.90) * streak;",
"  }",
"  col += 0.10 * vec3(0.2, 0.6, 0.55) * exp(-pow((uv.y - 0.30) * 3.4, 2.0)) * (0.5 + 0.5 * fbm(vec2(p.x * 2.5 - uTime * 0.05, 3.0)));",
"  col *= 1.0 - 0.40 * pow(length(uv - 0.5) * 1.2, 2.4);",
"  gl_FragColor = vec4(col, 1.0);",
"}"
].join("\n");

  var gl = canvas.getContext("webgl", { antialias: false, alpha: false, powerPreference: "high-performance" }) ||
           canvas.getContext("experimental-webgl");
  var prog, uni = {};
  function sh(type, src) {
    var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.warn(gl.getShaderInfoLog(s)); return null; }
    return s;
  }
  function fallback() { document.body.classList.add("no-gl"); canvas.style.display = "none"; }
  if (!gl) { fallback(); }
  else {
    var vs = sh(gl.VERTEX_SHADER, VERT), fs = sh(gl.FRAGMENT_SHADER, FRAG);
    prog = vs && fs ? gl.createProgram() : null;
    if (!prog) { fallback(); }
    else {
      gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { console.warn(gl.getProgramInfoLog(prog)); fallback(); prog = null; }
    }
  }
  if (prog) {
    gl.useProgram(prog);
    var buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    var loc = gl.getAttribLocation(prog, "a"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    ["uRes", "uTime", "uFront", "uMouse"].forEach(function (n) { uni[n] = gl.getUniformLocation(prog, n); });

    var scale = Math.min(window.devicePixelRatio || 1, 1.5) * 0.95;   // render below native size: the sea is soft, the text stays sharp
    var minScale = 0.5;
    function resize() {
      var w = Math.max(2, Math.floor(innerWidth * scale)), h = Math.max(2, Math.floor(innerHeight * scale));
      if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; gl.viewport(0, 0, w, h); }
    }
    addEventListener("resize", resize); resize();

    var mx = 0, my = 0, tx = 0, ty = 0;
    addEventListener("pointermove", function (e) { tx = e.clientX / innerWidth - 0.5; ty = 0.5 - e.clientY / innerHeight; }, { passive: true });

    var surge = 0, surging = false, surgeStart = 0;
    var t0 = performance.now(), last = t0, acc = 0, frames = 0, tuned = false;
    var timeScale = reduce ? 0.2 : 1;
    function ease(x) { return x < 0.5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2; }

    function frame(now) {
      var dt = now - last; last = now;
      if (!tuned && dt < 500) {                       // adapt resolution to the device in the first ~40 frames
        acc += dt; frames++;
        if (frames === 40) {
          tuned = true; var avg = acc / frames;
          if (!/[?&]notune/.test(location.search) && avg > 42 && scale > minScale) { scale = Math.max(minScale, scale * Math.sqrt(30 / avg)); resize(); }
        }
      }
      mx += (tx - mx) * 0.04; my += (ty - my) * 0.04;
      var time = (now - t0) / 1000 * timeScale;
      var front = 13.0 + Math.sin(time * 0.22) * 1.1;
      if (surging) {
        surge = Math.min(1, (now - surgeStart) / 1500);
        front -= 19 * ease(surge);
        flash.style.opacity = String(Math.max(0, (surge - 0.62) / 0.38));
      }
      gl.uniform2f(uni.uRes, canvas.width, canvas.height);
      gl.uniform1f(uni.uTime, time);
      gl.uniform1f(uni.uFront, front);
      gl.uniform2f(uni.uMouse, mx, my);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(function (n) { last = n; frame(n); });

    Array.prototype.forEach.call(links, function (link) {
      link.addEventListener("click", function (e) {
        if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
        if (reduce || surging) return;                  // plain navigation
        e.preventDefault(); surging = true; surgeStart = performance.now();
        setTimeout(function () { location.href = link.href; }, 1500);
      });
    });
  }
})();
</script>
</body>
