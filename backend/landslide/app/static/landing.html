<html lang="en">

<title>LANDLAB</title>
<meta name="description" content="LANDLAB - landslide hazard and impact modelling for Pakistan: rain and earthquake triggers, debris runout, buildings, roads and loss.">
<meta name="theme-color" content="#0F0B08">

<style>
  :root {
    --ink: #F3EBDF;
    --accent: #E39B4B;
    --accent-deep: #C8702C;
    --rust: #C9573C;
    --bg: #0F0B08;
    --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --text: "Archivo Narrow", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--text); overflow: hidden; -webkit-font-smoothing: antialiased; }
  /* CSS-only fallback when WebGL is unavailable: a dusk slope with a brown scar */
  body.no-gl {
    background:
      radial-gradient(120% 60% at 50% 0%, #4a3523 0%, transparent 60%),
      linear-gradient(165deg, #2a2017 0%, #3b2c1e 40%, #1b140e 72%, #0F0B08 100%);
  }
  canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .veil {
    position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(58% 44% at 50% 50%, rgba(12, 8, 5, .62) 0%, rgba(12, 8, 5, .3) 55%, transparent 100%),
      radial-gradient(130% 100% at 50% 50%, transparent 55%, rgba(10, 6, 3, .62) 100%);
    transition: opacity .6s;
  }
  header.top, footer.meta {
    position: fixed; z-index: 3; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; gap: 16px;
    padding: 0 clamp(16px, 4vw, 48px); font-size: .74rem; letter-spacing: .26em; text-transform: uppercase;
    color: rgba(255, 244, 228, .74); transition: opacity .5s;
  }
  header.top { top: 0; height: 58px; border-bottom: 1px solid rgba(227, 155, 75, .22); background: linear-gradient(180deg, rgba(12, 8, 5, .78), rgba(12, 8, 5, .25)); }
  header.top .left { display: flex; align-items: center; gap: 14px; min-width: 0; }
  header.top .brand { font-family: var(--display); font-weight: 800; letter-spacing: .3em; color: #fff; }
  header.top .agn-logo { display: inline-flex; align-items: center; line-height: 0; flex: 0 0 auto; background: #fff; border-radius: 6px; padding: 3px 8px; border: 1px solid rgba(227, 155, 75, .3); text-decoration: none; }
  header.top .agn-logo img { height: 28px; width: auto; display: block; }
  footer.meta { bottom: 0; height: 52px; border-top: 1px solid rgba(227, 155, 75, .22); background: linear-gradient(0deg, rgba(12, 8, 5, .78), rgba(12, 8, 5, .25)); }
  @media (max-width: 640px) { header.top .tag { display: none; } footer.meta span:first-child { display: none; } footer.meta { justify-content: center; } }
  main {
    position: relative; z-index: 2; min-height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding: 15vh 20px 8vh; text-align: center; transition: opacity .55s, transform 1.2s cubic-bezier(.2, .8, .2, 1);
  }
  h1 {
    margin: 0; font-family: var(--display); font-weight: 800; font-stretch: 100%;
    font-size: clamp(2.2rem, 7.2vw, 5.2rem); line-height: 1; letter-spacing: .16em; padding-left: .16em; color: #fff;
    text-shadow: 0 0 34px rgba(227, 155, 75, .38), 0 0 90px rgba(201, 87, 60, .22), 0 2px 26px rgba(0, 0, 0, .85);
  }
  .full {
    margin: clamp(16px, 3vh, 30px) 0 0; max-width: 40em; font-family: var(--text); font-weight: 500;
    font-size: clamp(.78rem, 1.3vw, .98rem); letter-spacing: .28em; text-transform: uppercase; line-height: 2; text-wrap: balance;
    color: #fff; text-shadow: 0 2px 14px rgba(0, 0, 0, .92);
  }
  .full b { color: var(--accent); font-weight: 700; }
  .rule { width: 64px; height: 1px; margin: clamp(20px, 3.4vh, 36px) 0; background: var(--accent); opacity: .9; }
  .choices { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .open {
    appearance: none; text-decoration: none; cursor: pointer; display: inline-flex; align-items: center; gap: .9em; padding: 1em 2.2em;
    font-family: var(--display); font-weight: 700; font-stretch: 100%; font-size: clamp(.8rem, 1.2vw, .92rem); letter-spacing: .24em; text-transform: uppercase;
    color: #fff; background: rgba(15, 10, 6, .6); border: 1px solid var(--accent); border-radius: 2px; transition: background .25s, color .25s, border-color .25s;
  }
  .open svg { width: 1.2em; height: 1.2em; transition: transform .3s cubic-bezier(.2, .8, .2, 1); }
  .open:hover, .open:focus-visible { background: var(--accent); color: #1a0f02; }
  .open:hover svg, .open:focus-visible svg { transform: translateX(4px); }
  .open:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }
  .rise > * { opacity: 0; transform: translateY(18px); animation: rise .9s cubic-bezier(.2, .8, .2, 1) forwards; }
  .rise > :nth-child(1) { animation-delay: .15s; } .rise > :nth-child(2) { animation-delay: .4s; } .rise > :nth-child(3) { animation-delay: .6s; } .rise > :nth-child(4) { animation-delay: .75s; }
  @keyframes rise { to { opacity: 1; transform: none; } }
  /* the click: text steps back, the slope lets go, the slide fills the screen, then the app */
  body.go header.top, body.go footer.meta, body.go .veil { opacity: 0; }
  body.go main { opacity: 0; transform: scale(.96) translateY(-10px); pointer-events: none; }
  .cover { position: fixed; inset: 0; z-index: 5; pointer-events: none; opacity: 0; background: #0F0B08; }
  @media (prefers-reduced-motion: reduce) { .rise > * { animation: none; opacity: 1; transform: none; } }
  @media (max-width: 520px) { main { padding-left: 14px; padding-right: 14px; } h1 { letter-spacing: .12em; } .full { letter-spacing: .14em; font-size: .72rem; line-height: 1.9; max-width: 100%; } .open { padding: .9em 1.4em; letter-spacing: .16em; } }
  @media (max-height: 560px) { h1 { font-size: clamp(2rem, 8vw, 4.5rem); } .rule { margin: 10px 0 16px; } main { padding-top: 11vh; } }
</style>
</head>
