[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "landslide-platform"
version = "1.0.0"
description = "Multi-engine landslide hazard platform (screening-grade) - see docs/LANDSLIDE_PLATFORM_FULL_METHODOLOGY.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pandas>=2.1", "scikit-learn>=1.4", "pyyaml>=6"]

[project.optional-dependencies]
geo = ["rasterio>=1.3", "geopandas>=0.14", "shapely>=2.0", "pyproj>=3.6", "pyogrio", "xarray", "dask", "zarr", "netcdf4"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.6", "redis", "rq"]
fetch = ["cdsapi", "earthaccess"]
ml = ["xgboost", "lightgbm"]
dev = ["pytest>=8", "pytest-cov", "ruff"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 130
