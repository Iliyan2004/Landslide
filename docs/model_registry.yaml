  - {id: M17, name: RUSLE, module: landslide.models.sediment.hillslope_channel, status: implemented_tested, tier: D, release_guard: "Annual screening; C table is a scenario"}
  - {id: M18, name: Shields + MPM, module: landslide.models.sediment.hillslope_channel, status: implemented_tested, tier: D, release_guard: "Noncohesive beds; per-width vs total"}
