# Model catalogue M01-M22 (methodology §6) with implementation status in THIS repository.
status_legend:
  implemented_tested: code + unit tests in backend/tests
  adapter_only: contract + gates implemented; validated external engine required
  not_implemented: interface documented only
models:
  - {id: M01, name: Legacy slope+lithology score, module: landslide.models.susceptibility.legacy, status: implemented_tested, tier: S, release_guard: "Not a physical probability; config is placeholder pending SAILAB reconciliation"}
  - {id: M02, name: Logistic susceptibility, module: landslide.models.susceptibility.statistical, status: implemented_tested, tier: S, release_guard: "Spatial-block CV required; relative score unless calibrated"}
  - {id: M03, name: Random forest, module: landslide.models.susceptibility.statistical, status: implemented_tested, tier: S, release_guard: "Blocked/event holdouts; OOD suppression"}
  - {id: M04, name: Gradient boosting (sklearn; XGBoost/LightGBM optional), module: landslide.models.susceptibility.statistical, status: implemented_tested, tier: S, release_guard: "Spatial CV mandatory"}
  - {id: M05, name: CNN/U-Net scar segmentation, status: not_implemented, tier: S, release_guard: "Detection only; needs labelled polygons + GPU; see change_detection.py for candidate flags"}
  - {id: M06, name: LHASA benchmark, status: not_implemented, tier: S, release_guard: "Compare only; never train/test on LHASA output"}
  - {id: M07, name: Rainfall I-D threshold, module: landslide.models.monitoring.thresholds, status: implemented_tested, tier: M, release_guard: "Watch trigger; POD/FAR via contingency()"}
